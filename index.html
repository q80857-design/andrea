<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3dcf7">
<title>給你的小秘密</title>
<style>
:root{
  --pink:#f4b6dd; --pink-d:#e58fd0; --purple:#b58cf0; --purple-d:#8f6bd6;
  --ink:#5a3f78; --soft:#fff8fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#fde6f5 0%,#eadcff 55%,#dcd9ff 100%);
  background-attachment:fixed;
}
#gems{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}

.screen{display:none;min-height:100vh;min-height:100dvh;padding:28px 20px;
  align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{width:100%;max-width:380px;padding:30px 24px;border-radius:26px;text-align:center;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 12px 40px rgba(143,107,214,.22)}
h1{font-size:1.45rem;margin:0 0 6px;letter-spacing:.04em}
.sub{margin:0 0 22px;font-size:.95rem;opacity:.75}
.heart{font-size:2.2rem;margin-bottom:8px;display:inline-block;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

label{display:block;text-align:left;font-size:.85rem;margin:0 0 6px 4px;opacity:.8}
input{width:100%;padding:14px 16px;font-size:1.05rem;border:2px solid #e6d3f7;border-radius:16px;
  background:var(--soft);color:var(--ink);outline:none;margin-bottom:14px;font-family:inherit}
input:focus{border-color:var(--purple)}

.btn{display:block;width:100%;padding:14px;font-size:1.05rem;font-family:inherit;color:#fff;border:0;
  border-radius:999px;background:linear-gradient(90deg,var(--pink-d),var(--purple));
  box-shadow:0 6px 16px rgba(181,140,240,.4);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--purple-d);box-shadow:none;border:2px solid #d9c4f3;margin-top:10px}

.msg{min-height:1.5em;margin:12px 0 0;font-size:.95rem;color:#c0559e}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* quiz */
.progress{font-size:.85rem;opacity:.7;margin-bottom:10px}
.question{font-size:1.2rem;line-height:1.6;margin:0 0 20px}
.opt{display:block;width:100%;padding:14px;margin-bottom:12px;font-size:1.02rem;font-family:inherit;color:var(--ink);
  background:var(--soft);border:2px solid #e6d3f7;border-radius:16px;cursor:pointer}
.opt:active{transform:scale(.98)}
.opt.right{background:#f1e4ff;border-color:var(--purple)}
.opt.wrong{background:#ffe6f3;border-color:var(--pink-d)}
.opt:disabled{cursor:default}

/* envelope */
.env-wrap{text-align:center}
.env{position:relative;width:min(80vw,320px);height:min(54vw,214px);margin:70px auto 20px;
  perspective:900px;cursor:pointer}
.env-back{position:absolute;inset:0;background:#c9a6ec;border-radius:12px;box-shadow:0 14px 34px rgba(143,107,214,.35)}
.env-letter{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#fffafd;border-radius:8px;z-index:2;
  display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--pink-d);
  transition:transform 1s ease .55s}
.env-front{position:absolute;inset:0;z-index:3;border-radius:12px;
  background:linear-gradient(160deg,#f6c9e8,#d7b5f2);
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:4;transform-origin:top;
  background:linear-gradient(180deg,#ddb8f4,#c9a6ec);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .7s ease, z-index 0s .35s}
.seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;width:40px;height:40px;
  border-radius:50%;background:var(--pink-d);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;box-shadow:0 3px 8px rgba(0,0,0,.2);transition:opacity .3s}
.env.open .env-flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .env-letter{transform:translateY(-52%)}
.env-hint{font-size:1rem;opacity:.8;animation:beat 2s infinite}

/* letter */
#letter{justify-content:flex-start;padding-top:40px;padding-bottom:60px}
.paper{width:100%;max-width:480px;padding:34px 26px;border-radius:14px;background:#fffafd;
  box-shadow:0 12px 40px rgba(143,107,214,.25);
  background-image:repeating-linear-gradient(transparent,transparent 33px,#f1e4fa 34px)}
.paper p{margin:0 0 14px;font-size:1.05rem;line-height:34px;white-space:pre-wrap;
  font-family:"Noto Serif TC","Songti TC","Noto Serif CJK TC",serif}
.paper .greet{font-weight:700}
.paper .line{opacity:0;animation:fade .8s ease forwards}
.sign{text-align:right;margin-top:18px}
.photo{margin:26px 0 6px;text-align:center}
.photo img{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;box-shadow:0 8px 24px rgba(143,107,214,.3)}
.photo .ph{padding:34px 12px;border:2px dashed #d9c4f3;border-radius:12px;font-size:.9rem;opacity:.7}
.photo small{display:block;margin-top:8px;opacity:.7}
.again{max-width:480px;width:100%;margin-top:22px}
</style>
</head>
<body>
<canvas id="gems" aria-hidden="true"></canvas>
<main>

  <!-- 1 登入 -->
  <section id="login" class="screen active">
    <form class="card" id="loginForm" autocomplete="off">
      <div class="heart">♡</div>
      <h1 id="loginTitle"></h1>
      <p class="sub" id="loginSub"></p>
      <label for="acct">帳號</label>
      <input id="acct" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="妳叫什麼">
      <label for="pwd">密碼</label>
      <input id="pwd" type="password" inputmode="numeric" autocomplete="off" placeholder="今天什麼日子">
      <button class="btn" type="submit">登入</button>
      <p class="msg" id="loginMsg" role="status"></p>
    </form>
  </section>

  <!-- 2 問答 -->
  <section id="quiz" class="screen">
    <div class="card">
      <div class="progress" id="qProgress"></div>
      <p class="question" id="qText"></p>
      <div id="qOptions"></div>
      <p class="msg" id="qMsg" role="status"></p>
    </div>
  </section>

  <!-- 3 信封 -->
  <section id="envelope" class="screen">
    <div class="env-wrap">
      <div class="env" id="env" role="button" tabindex="0" aria-label="打開信封">
        <div class="env-back"></div>
        <div class="env-letter">♡</div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">♡</div>
      </div>
      <p class="env-hint" id="envHint"></p>
    </div>
  </section>

  <!-- 4 情書 -->
  <section id="letter" class="screen">
    <article class="paper" id="paper"></article>
    <button class="btn ghost again" id="again" type="button">再看一次 ♡</button>
  </section>

</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
